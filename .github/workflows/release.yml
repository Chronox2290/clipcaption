name: Release

# Builds a signed Windows installer + the updater manifest (latest.json) and
# attaches them to a GitHub Release whenever a version tag (v1.2.3) is pushed.
# tauri-plugin-updater (wired up in the app) then finds new releases here
# automatically — see src/lib.rs / src/components/UpdateBanner.tsx.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Without this every release recompiles the entire dependency graph
      # (tauri, wry, webview2, serde, ...) from scratch, which is the bulk of
      # a ~20 minute build. Keyed on Cargo.lock by the action itself.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      # ~375MB of downloads from GitHub releases and HuggingFace on every run
      # otherwise. Both scripts below skip anything already present, so a cache
      # hit turns them into no-ops. Bump the "v1" in the key to force a refetch
      # - worth knowing that get-sidecars.ps1 asks for whisper.cpp's *latest*
      # release, so a warm cache also pins the whisper version until then.
      - name: Cache sidecar binaries
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: sidecars-v1-${{ runner.os }}-${{ hashFiles('scripts/get-sidecars.ps1', 'scripts/build-embed-tool.ps1') }}

      - name: Fetch sidecar binaries (ffmpeg, ffprobe, whisper-cli)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: powershell -ExecutionPolicy Bypass -File scripts/get-sidecars.ps1

      # Compiles src-tauri/embed-tool (the speaker-embedding extractor) with
      # the runner's MSVC toolchain - nobody publishes a prebuilt binary for
      # it. Must run BEFORE the Tauri build: tauri.conf.json lists
      # binaries/extract-embedding as an externalBin, and a missing sidecar
      # fails the bundle step with a "resource path doesn't exist" error far
      # less obvious than failing right here.
      - name: Build speaker-embedding tool
        run: powershell -ExecutionPolicy Bypass -File scripts/build-embed-tool.ps1

      - name: Build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ClipCaption ${{ github.ref_name }}"
          releaseBody: |
            See clipcaption/05-build-log.md (in the Mini Programming Fun project) for what changed.
          # Left as a draft on purpose: the workflow builds and uploads
          # everything, but nothing goes live for auto-update until you open
          # the release on GitHub and click "Publish release" yourself — a
          # deliberate checkpoint before every user's app auto-updates.
          releaseDraft: true
          prerelease: false
