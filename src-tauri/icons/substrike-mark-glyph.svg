<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="violetGlyph" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#9B82FF" />
      <stop offset="100%" stopColor="#7C5CFF" />
    </linearGradient>
    <filter id="glyphGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- T-Stem (Electric Violet #7C5CFF) -->
  <path d="M 212 180 L 300 180 L 300 372 A 18 18 0 0 1 282 390 L 230 390 A 18 18 0 0 1 212 372 Z" fill="url(#violetGlyph)" />

  <!-- T-Crossbar: Caption / Subtitle Bar Plate -->
  <rect x="96" y="110" width="320" height="80" rx="24" fill="url(#violetGlyph)" />

  <!-- Subtitle Track inside the Caption Bar -->
  <!-- Left base text slot (Obsidian Black #0B0D12) -->
  <rect x="126" y="136" width="128" height="28" rx="14" fill="#0B0D12" />

  <!-- Right active karaoke word highlight (Cyber Cyan #2EE6FF) -->
  <rect x="266" y="136" width="120" height="28" rx="14" fill="#2EE6FF" filter="url(#glyphGlow)" />
</svg>